<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Рабочие</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="snowCanvas"></canvas>

<div class="container">

    <!-- ЗАГОЛОВОК ПРОЕКТА -->
    <div class="project-header">
        <h1 class="project-title">⚡ Мои Рабочие</h1>
        <p class="project-subtitle">Список команды разработчиков и специалистов</p>
    </div>

    <!-- КНОПКА УРОВНЕЙ -->
    <div class="levels-button-section">
        <button id="levelsBtn" class="levels-btn">
            <i class="fas fa-layer-group"></i>
            <span>📊 Уровни Крафтеров</span>
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО УРОВНЕЙ -->
    <div id="levelsModal" class="levels-modal">
        <div class="levels-modal-content">
            <span class="close-levels-modal">&times;</span>
            <div class="levels-modal-container">
                <div class="levels-list-side">
                    <h2>Уровни</h2>
                    <div id="levelsList" class="levels-list">
                        <!-- Заполняется JavaScript -->
                    </div>
                </div>
                <div class="levels-details-side">
                    <div id="levelDetails" class="level-details">
                        <!-- Заполняется JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- РАБОЧИЕ СПИСОК -->
    <div class="workers-section">
        <h2>👥 Команда</h2>
        <div class="workers-list" id="workersList">
            <!-- Заполняется JavaScript -->
        </div>
    </div>

    <!-- КОНТАКТЫ -->
    <div class="contact-section">
        <a href="https://t.me/Toolgool" target="_blank" class="contact-link telegram-link">
            <i class="fab fa-telegram"></i>
            <span>My Telegram</span>
        </a>
    </div>

</div>

<script src="script.js"></script>
</body>
        </html>
